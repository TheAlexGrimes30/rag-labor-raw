services:
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage

  app:
    build: .
    container_name: rag_app
    depends_on:
      - qdrant
    volumes:
      - .:/app
    working_dir: /app
    command: python classic_rag/Hybrid/classic_rag_hybrid.py
